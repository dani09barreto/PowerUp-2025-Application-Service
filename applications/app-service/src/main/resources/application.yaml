server:
  port: 8081
spring:
  r2dbc:
    url: "${SPRING_R2DBC_URL}"
    username: "${SPRING_R2DBC_USERNAME}"
    password: "${SPRING_R2DBC_PASSWORD}"
  application:
    name: "ApplicationService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapter:
  restauthconsumer:
    timeout: 5000
    url: "${AUTH_SERVICE_URL}"
  sqs:
    region: "us-east-2"
    queueUrl: https://sqs.us-east-2.amazonaws.com/315922615470/CreditRequestStatusQueue
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
jwt:
  secret: "3DkU2McWzyrA1P7gL9QnTw5XnYvR8jB2dK7wGfS9h8cT4nM1pXqZrL0vWmYjHsQe"
  expiration: 3600
